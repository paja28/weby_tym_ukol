<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hodiny</title>
    <link rel="stylesheet" href="hodinar.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="vlastni-alert">Nastavení uloženo</div>

    <div class="Hodiny">
        <span id="hodiny"></span>:<span id="minuty"></span>:<span id="sekundy"></span>
    </div>
    
    <p id="datum"></p>

    <button id="toggle-nastaveni">Nastavení</button>

    <div id="nastaveni-panel" class="skryty">
        <label for="posun">Posun v minutách:</label>
        <input type="number" id="posun" value="0">
        <button id="tlac_posun">Uložit posun</button>
    </div>

    <script src="hodinky.js"></script>
</body>
</html>
